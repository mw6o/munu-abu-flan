<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لوحة التحكم - Admin Panel</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #F2F2F7;
      --bg-card: rgba(255, 255, 255, 0.75);
      --text-primary: #1C1C1E;
      --text-secondary: #8E8E93;
      --primary: #007AFF;
      --danger: #FF3B30;
      --success: #34C759;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.08);
      --border-light: rgba(255,255,255,0.6);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Cairo', sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      direction: rtl;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 30% 20%, rgba(0,122,255,0.06), transparent 50%),
        radial-gradient(circle at 70% 60%, rgba(0,122,255,0.04), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 700px;
      position: relative;
      z-index: 1;
    }

    /* ==================== الهيدر ==================== */
    .header {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: var(--shadow-md);
      padding: 14px 18px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 16px;
      z-index: 100;
    }

    .header h1 {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      text-align: center;
    }

    .btn-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.6);
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      text-decoration: none;
      color: var(--text-primary);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      flex-shrink: 0;
    }
    .btn-icon:hover { background: white; transform: scale(1.05); }

    /* ==================== التبويبات ==================== */
    .tabs {
      display: flex;
      gap: 3px;
      background: rgba(0,0,0,0.04);
      border-radius: var(--radius-sm);
      padding: 3px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      position: sticky;
      top: 105px;
      z-index: 99;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .tab {
      flex: 1;
      min-width: 65px;
      padding: 10px 6px;
      border-radius: 10px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.3s;
      text-align: center;
    }
    .tab.active { background: white; color: var(--text-primary); box-shadow: var(--shadow-sm); }

    /* ==================== الكروت ==================== */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      padding: 18px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-badge {
      width: 28px; height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }
    .icon-blue { background: #E8F2FF; }
    .icon-green { background: #E5F9E8; }
    .icon-orange { background: #FFF3E5; }
    .icon-purple { background: #F0EBFF; }

    /* ==================== الحقول ==================== */
    .input-group { margin-bottom: 10px; }
    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(0,0,0,0.1);
      background: rgba(255,255,255,0.8);
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--text-primary);
      transition: all 0.2s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #007AFF;
      box-shadow: 0 0 0 3px rgba(0,122,255,0.12);
      background: white;
    }
    textarea { min-height: 65px; resize: vertical; }

    /* ==================== الأزرار ==================== */
    .btn {
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #007AFF; color: white; width: 100%; }
    .btn-primary:hover { background: #0066D6; }
    .btn-danger { background: #FF3B30; color: white; }
    .btn-ghost { background: rgba(0,0,0,0.04); color: var(--text-primary); border: 1px solid rgba(0,0,0,0.08); }
    .btn-sm { padding: 6px 12px; font-size: 0.78rem; border-radius: 8px; }
    .btn-xs { padding: 4px 8px; font-size: 0.7rem; border-radius: 6px; }

    /* ==================== القوائم ==================== */
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255,255,255,0.5);
      border-radius: var(--radius-sm);
      margin-bottom: 7px;
      gap: 10px;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .list-item img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .list-item .info { flex: 1; min-width: 0; }
    .list-item .name { font-weight: 700; font-size: 0.85rem; }
    .list-item .detail { font-size: 0.72rem; color: var(--text-secondary); }
    .list-item .actions { display: flex; gap: 4px; flex-shrink: 0; }

    /* ==================== رفع الصور ==================== */
    .upload-area {
      border: 2px dashed rgba(0,0,0,0.12);
      border-radius: var(--radius-md);
      padding: 18px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255,255,255,0.4);
    }
    .upload-area:hover { border-color: #007AFF; background: rgba(0,122,255,0.04); }
    .upload-area input[type="file"] { display: none; }
    .preview-img {
      width: 65px; height: 65px;
      border-radius: 14px;
      object-fit: cover;
      margin: 8px auto;
      display: block;
      box-shadow: var(--shadow-sm);
    }

    /* ==================== مودال التعديل ==================== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal {
      background: white;
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
    }
    .modal .btn { margin-top: 8px; }

    /* ==================== محدد الألوان ==================== */
    .color-picker-group { display: flex; align-items: center; gap: 10px; }
    input[type="color"] {
      width: 38px; height: 38px;
      padding: 2px;
      border-radius: 10px;
      border: 2px solid rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .color-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .color-preset {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .color-preset:hover { transform: scale(1.15); }
    .color-preset.active { border-color: #1C1C1E; box-shadow: 0 0 0 3px rgba(0,122,255,0.3); }

    /* ==================== إشعار ==================== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1C1C1E;
      color: white;
      padding: 12px 24px;
      border-radius: 100px;
      font-weight: 600;
      font-size: 0.85rem;
      z-index: 300;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      animation: toastIn 0.3s ease;
      white-space: nowrap;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @media (max-width: 500px) {
      body { padding: 8px; }
      .card { padding: 14px; }
      .tab { font-size: 0.7rem; padding: 8px 4px; }
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- الهيدر -->
    <div class="header">
      <a href="index.html" class="btn-icon" title="العودة للمنيو">←</a>
      <h1>🎛️ لوحة التحكم</h1>
      <div style="width:38px;"></div>
    </div>

    <!-- التبويبات -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('general')">⚙️ عام</button>
      <button class="tab" onclick="switchTab('banners')">🎯 البنرات</button>
      <button class="tab" onclick="switchTab('categories')">📂 الأصناف</button>
      <button class="tab" onclick="switchTab('products')">🍽️ المنتجات</button>
      <button class="tab" onclick="switchTab('theme')">🎨 الثيم</button>
    </div>

    <!-- ========== تبويب عام ========== -->
    <div id="tab-general" class="tab-content">
      <div class="card">
        <div class="card-title"><span class="icon-badge icon-blue">🏪</span> معلومات المطعم</div>
        <div class="input-group">
          <label>اسم المطعم</label>
          <input id="restaurantNameInput" placeholder="أدخل اسم المطعم">
        </div>
        <div class="input-group">
          <label>شعار المطعم</label>
          <div class="upload-area" onclick="document.getElementById('logoFileInput').click()">
            <div style="font-size:1.5rem;">🖼️</div>
            <p style="font-size:0.8rem;color:var(--text-secondary);">اضغط لرفع الشعار</p>
            <input type="file" id="logoFileInput" accept="image/*" onchange="handleLogoUpload(event)">
          </div>
          <img id="logoPreview" class="preview-img" style="display:none;" alt="معاينة">
        </div>
        <button class="btn btn-primary" onclick="updateRestaurant()">💾 حفظ التغييرات</button>
      </div>
    </div>

    <!-- ========== تبويب البنرات ========== -->
    <div id="tab-banners" class="tab-content" style="display:none;">
      <div class="card">
        <div class="card-title"><span class="icon-badge icon-orange">🎯</span> إضافة بنر جديد</div>
        <div class="input-group"><label>العنوان (اختياري)</label><input id="bannerTitle" placeholder="عنوان البنر"></div>
        <div class="input-group"><label>العنوان الفرعي (اختياري)</label><input id="bannerSubtitle" placeholder="نص فرعي"></div>
        <div class="input-group">
          <label>صورة البنر</label>
          <div class="upload-area" onclick="document.getElementById('bannerImageInput').click()">
            <div style="font-size:1.5rem;">🖼️</div>
            <p style="font-size:0.8rem;color:var(--text-secondary);">اضغط لرفع صورة البنر</p>
            <input type="file" id="bannerImageInput" accept="image/*" onchange="handleBannerImagePreview(event)">
          </div>
          <img id="bannerImagePreview" class="preview-img" style="display:none;" alt="معاينة">
        </div>
        <button class="btn btn-primary" onclick="addBanner()">إضافة البنر</button>
      </div>
      <div class="card">
        <div class="card-title"><span class="icon-badge icon-purple">📋</span> البنرات الحالية</div>
        <div id="bannerList"></div>
      </div>
    </div>

    <!-- ========== تبويب الأصناف ========== -->
    <div id="tab-categories" class="tab-content" style="display:none;">
      <div class="card">
        <div class="card-title"><span class="icon-badge icon-green">➕</span> إضافة صنف جديد</div>
        <div class="input-group"><label>اسم الصنف</label><input id="catName" placeholder="مثال: مشروبات، وجبات..."></div>
        <button class="btn btn-primary" onclick="addCategory()">إضافة الصنف</button>
      </div>
      <div class="card">
        <div class="card-title"><span class="icon-badge icon-purple">📋</span> الأصناف الحالية</div>
        <div id="categoryList"></div>
      </div>
    </div>

    <!-- ========== تبويب المنتجات ========== -->
    <div id="tab-products" class="tab-content" style="display:none;">
      <div class="card">
        <div class="card-title"><span class="icon-badge icon-orange">🍕</span> إضافة منتج جديد</div>
        <div class="input-group"><label>اسم المنتج</label><input id="name" placeholder="اسم المنتج"></div>
        <div class="input-group"><label>السعر (د.ع)</label><input id="price" type="number" placeholder="السعر"></div>
        <div class="input-group"><label>التصنيف</label><select id="category"></select></div>
        <div class="input-group"><label>ملاحظات (اختياري)</label><textarea id="note" placeholder="ملاحظات إضافية..."></textarea></div>
        <div class="input-group">
          <label>صورة المنتج</label>
          <div class="upload-area" onclick="document.getElementById('productImageInput').click()">
            <div style="font-size:1.5rem;">📸</div>
            <p style="font-size:0.8rem;color:var(--text-secondary);">اضغط لرفع صورة المنتج</p>
            <input type="file" id="productImageInput" accept="image/*" onchange="handleProductImagePreview(event)">
          </div>
          <img id="productImagePreview" class="preview-img" style="display:none;" alt="معاينة">
        </div>
        <button class="btn btn-primary" onclick="addProduct()">إضافة المنتج</button>
      </div>
      <div class="card">
        <div class="card-title"><span class="icon-badge icon-purple">📦</span> المنتجات الحالية</div>
        <div id="productList"></div>
      </div>
    </div>

    <!-- ========== تبويب الثيم ========== -->
    <div id="tab-theme" class="tab-content" style="display:none;">
      <div class="card">
        <div class="card-title"><span class="icon-badge icon-purple">🎨</span> تخصيص الألوان</div>
        <div class="input-group">
          <label>اللون الأساسي</label>
          <div class="color-picker-group">
            <input type="color" id="themePrimary" value="#007AFF" onchange="updateColorPresetSelection()">
            <span style="font-size:0.78rem;color:var(--text-secondary);">اللون الرئيسي للتطبيق</span>
          </div>
          <div class="color-presets" id="colorPresets">
            <span class="color-preset active" style="background:#007AFF;" data-color="#007AFF" onclick="selectPreset('#007AFF')"></span>
            <span class="color-preset" style="background:#FF6B00;" data-color="#FF6B00" onclick="selectPreset('#FF6B00')"></span>
            <span class="color-preset" style="background:#34C759;" data-color="#34C759" onclick="selectPreset('#34C759')"></span>
            <span class="color-preset" style="background:#FF3B30;" data-color="#FF3B30" onclick="selectPreset('#FF3B30')"></span>
            <span class="color-preset" style="background:#5856D6;" data-color="#5856D6" onclick="selectPreset('#5856D6')"></span>
            <span class="color-preset" style="background:#FF2D55;" data-color="#FF2D55" onclick="selectPreset('#FF2D55')"></span>
            <span class="color-preset" style="background:#AF52DE;" data-color="#AF52DE" onclick="selectPreset('#AF52DE')"></span>
            <span class="color-preset" style="background:#FF9500;" data-color="#FF9500" onclick="selectPreset('#FF9500')"></span>
          </div>
        </div>
        <div class="input-group"><label>لون الخلفية</label><input type="color" id="themeBg" value="#F2F2F7"></div>
        <div class="input-group"><label>لون النص الأساسي</label><input type="color" id="themeText" value="#1C1C1E"></div>
        <div class="input-group"><label>لون النص الثانوي</label><input type="color" id="themeTextSecondary" value="#8E8E93"></div>
        <div class="input-group"><label>لون خلفية البطاقات</label><input type="color" id="themeCardBg" value="#FFFFFF"></div>
        <button class="btn btn-primary" onclick="saveTheme()">💾 حفظ الثيم</button>
        <button class="btn btn-ghost" style="margin-top:6px;width:100%;" onclick="resetTheme()">🔄 استعادة الألوان الافتراضية</button>
      </div>
    </div>

  </div>

  <!-- مودال التعديل -->
  <div id="modalContainer"></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // ==================== Firebase ====================
    const firebaseConfig = {
      apiKey: "AIzaSyAeAAbKRX1mfJQ-aWuM8pXjQX7xhBoQItM",
      authDomain: "menu-abu-flan.firebaseapp.com",
      databaseURL: "https://menu-abu-flan-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "menu-abu-flan",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let categories = [], products = [], banners = [];
    let restaurantName = "", logoUrl = "", theme = {};
    let productImageData = null, logoImageData = null, bannerImageData = null;

    // ==================== إشعار Toast ====================
    function showToast(msg) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2200);
    }

    // ==================== تحميل البيانات ====================
    function loadData() {
      db.ref("menu").on("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
          categories = data.categories || [];
          products = data.products || [];
          banners = data.banners || [];
          restaurantName = data.restaurantName || "";
          logoUrl = data.logo || "";
          theme = data.theme || {};
          renderAll();
          loadThemeToForm();
        }
      });
    }

    function renderAll() {
      renderCategorySelect();
      renderCategoryList();
      renderProducts();
      renderBannerList();
      document.getElementById('restaurantNameInput').value = restaurantName;
      if (logoUrl) {
        document.getElementById('logoPreview').src = logoUrl;
        document.getElementById('logoPreview').style.display = 'block';
      }
    }

    function saveAllData(callback) {
      db.ref("menu").set({
        categories, products, banners,
        restaurantName, logo: logoUrl, theme
      }, (error) => {
        if (error) {
          showToast("❌ فشل الحفظ! تأكد من الاتصال");
        } else {
          showToast("✅ تم الحفظ بنجاح");
          renderAll();
          if (callback) callback();
        }
      });
    }

    // ==================== عام ====================
    function updateRestaurant() {
      const name = document.getElementById('restaurantNameInput').value.trim();
      if (!name) { showToast("⚠️ أدخل اسم المطعم"); return; }
      restaurantName = name;

      if (logoImageData) {
        const reader = new FileReader();
        reader.onload = function(e) {
          logoUrl = e.target.result;
          saveAllData(() => {
            document.getElementById('logoPreview').src = logoUrl;
            document.getElementById('logoPreview').style.display = 'block';
            logoImageData = null;
            document.getElementById('logoFileInput').value = '';
          });
        };
        reader.readAsDataURL(logoImageData);
      } else {
        saveAllData();
      }
    }

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        logoImageData = file;
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('logoPreview').src = e.target.result;
          document.getElementById('logoPreview').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    // ==================== البنرات ====================
    function handleBannerImagePreview(event) {
      const file = event.target.files[0];
      if (file) {
        bannerImageData = file;
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('bannerImagePreview').src = e.target.result;
          document.getElementById('bannerImagePreview').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    function addBanner() {
      const title = document.getElementById('bannerTitle').value.trim();
      const subtitle = document.getElementById('bannerSubtitle').value.trim();
      if (!bannerImageData) { showToast("⚠️ ارفع صورة البنر"); return; }

      const reader = new FileReader();
      reader.onload = function(e) {
        banners.push({ image: e.target.result, title, subtitle });
        saveAllData(() => {
          document.getElementById('bannerTitle').value = '';
          document.getElementById('bannerSubtitle').value = '';
          document.getElementById('bannerImageInput').value = '';
          document.getElementById('bannerImagePreview').style.display = 'none';
          bannerImageData = null;
        });
      };
      reader.readAsDataURL(bannerImageData);
    }

    function renderBannerList() {
      let html = '';
      if (banners.length === 0) {
        html = '<p style="text-align:center;color:var(--text-secondary);padding:20px;">لا توجد بنرات</p>';
      }
      banners.forEach((b, i) => {
        html += `
          <div class="list-item">
            <img src="${b.image}" alt="بنر">
            <div class="info">
              <div class="name">${b.title || 'بدون عنوان'}</div>
              <div class="detail">${b.subtitle || ''}</div>
            </div>
            <div class="actions">
              <button class="btn btn-ghost btn-sm" onclick="editBanner(${i})">✏️</button>
              <button class="btn btn-danger btn-sm" onclick="deleteBanner(${i})">🗑️</button>
            </div>
          </div>`;
      });
      document.getElementById('bannerList').innerHTML = html;
    }

    function editBanner(i) {
      const b = banners[i];
      document.getElementById('modalContainer').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
          <div class="modal">
            <h3>✏️ تعديل البنر</h3>
            <div class="input-group"><label>العنوان</label><input id="editBannerTitle" value="${b.title || ''}"></div>
            <div class="input-group"><label>العنوان الفرعي</label><input id="editBannerSubtitle" value="${b.subtitle || ''}"></div>
            <button class="btn btn-primary" onclick="saveEditBanner(${i})">💾 حفظ</button>
            <button class="btn btn-ghost" style="width:100%;margin-top:6px;" onclick="closeModal()">إلغاء</button>
          </div>
        </div>`;
    }

    function saveEditBanner(i) {
      banners[i].title = document.getElementById('editBannerTitle').value.trim();
      banners[i].subtitle = document.getElementById('editBannerSubtitle').value.trim();
      saveAllData();
      closeModal();
    }

    function deleteBanner(i) {
      if (confirm(`حذف البنر "${banners[i].title || 'بدون عنوان'}"؟`)) {
        banners.splice(i, 1);
        saveAllData();
      }
    }

    // ==================== الأصناف ====================
    function renderCategorySelect() {
      const select = document.getElementById('category');
      select.innerHTML = '<option value="">اختر التصنيف</option>';
      categories.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
    }

    function renderCategoryList() {
      let html = '';
      if (categories.length === 0) {
        html = '<p style="text-align:center;color:var(--text-secondary);padding:20px;">لا توجد أصناف</p>';
      }
      categories.forEach((c, i) => {
        html += `
          <div class="list-item">
            <span style="font-weight:600;">📁 ${c}</span>
            <div class="actions">
              <button class="btn btn-ghost btn-sm" onclick="editCategory(${i})">✏️</button>
              <button class="btn btn-danger btn-sm" onclick="deleteCategory(${i})">🗑️</button>
            </div>
          </div>`;
      });
      document.getElementById('categoryList').innerHTML = html;
    }

    function addCategory() {
      const name = document.getElementById('catName').value.trim();
      if (!name) { showToast("⚠️ أدخل اسم الصنف"); return; }
      if (categories.includes(name)) { showToast("⚠️ موجود مسبقاً"); return; }
      categories.push(name);
      saveAllData(() => {
        document.getElementById('catName').value = '';
      });
    }

    function editCategory(i) {
      document.getElementById('modalContainer').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
          <div class="modal">
            <h3>✏️ تعديل الصنف</h3>
            <div class="input-group"><label>اسم الصنف</label><input id="editCatName" value="${categories[i]}"></div>
            <button class="btn btn-primary" onclick="saveEditCategory(${i})">💾 حفظ</button>
            <button class="btn btn-ghost" style="width:100%;margin-top:6px;" onclick="closeModal()">إلغاء</button>
          </div>
        </div>`;
    }

    function saveEditCategory(i) {
      const newName = document.getElementById('editCatName').value.trim();
      if (newName) {
        const oldName = categories[i];
        products.forEach(p => { if (p.category === oldName) p.category = newName; });
        categories[i] = newName;
        saveAllData();
        closeModal();
      }
    }

    function deleteCategory(i) {
      if (confirm(`حذف "${categories[i]}"؟ (المنتجات المرتبطة ستبقى)`)) {
        categories.splice(i, 1);
        saveAllData();
      }
    }

    // ==================== المنتجات ====================
    function renderProducts() {
      let html = '';
      if (products.length === 0) {
        html = '<p style="text-align:center;color:var(--text-secondary);padding:20px;">لا توجد منتجات</p>';
      }
      products.forEach((p, i) => {
        html += `
          <div class="list-item">
            <img src="${p.image}" alt="${p.name}">
            <div class="info">
              <div class="name">${p.name}</div>
              <div class="detail">💰 ${p.price.toLocaleString()} د.ع | 📂 ${p.category} ${p.note ? '| 📝 ' + p.note : ''}</div>
            </div>
            <div class="actions">
              <button class="btn btn-ghost btn-sm" onclick="editProduct(${i})">✏️</button>
              <button class="btn btn-danger btn-sm" onclick="deleteProduct(${i})">🗑️</button>
            </div>
          </div>`;
      });
      document.getElementById('productList').innerHTML = html;
    }

    function handleProductImagePreview(event) {
      const file = event.target.files[0];
      if (file) {
        productImageData = file;
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('productImagePreview').src = e.target.result;
          document.getElementById('productImagePreview').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    function addProduct() {
      const name = document.getElementById('name').value.trim();
      const price = document.getElementById('price').value;
      const category = document.getElementById('category').value;
      const note = document.getElementById('note').value.trim();

      if (!name || price === '' || isNaN(price)) { showToast("⚠️ اسم وسعر صحيح"); return; }
      if (!category) { showToast("⚠️ اختر تصنيف"); return; }
      if (!productImageData) { showToast("⚠️ ارفع صورة"); return; }

      const reader = new FileReader();
      reader.onload = function(e) {
        products.push({ name, price: parseInt(price), category, note, image: e.target.result });
        saveAllData(() => {
          document.getElementById('name').value = '';
          document.getElementById('price').value = '';
          document.getElementById('note').value = '';
          document.getElementById('productImageInput').value = '';
          document.getElementById('productImagePreview').style.display = 'none';
          productImageData = null;
        });
      };
      reader.readAsDataURL(productImageData);
    }

    function editProduct(i) {
      const p = products[i];
      document.getElementById('modalContainer').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
          <div class="modal">
            <h3>✏️ تعديل المنتج</h3>
            <div class="input-group"><label>اسم المنتج</label><input id="editName" value="${p.name}"></div>
            <div class="input-group"><label>السعر</label><input id="editPrice" type="number" value="${p.price}"></div>
            <div class="input-group"><label>التصنيف</label><select id="editCategory">${categories.map(c => `<option value="${c}" ${c === p.category ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
            <div class="input-group"><label>ملاحظات</label><textarea id="editNote">${p.note || ''}</textarea></div>
            <button class="btn btn-primary" onclick="saveEditProduct(${i})">💾 حفظ</button>
            <button class="btn btn-ghost" style="width:100%;margin-top:6px;" onclick="closeModal()">إلغاء</button>
          </div>
        </div>`;
    }

    function saveEditProduct(i) {
      const name = document.getElementById('editName').value.trim();
      const price = document.getElementById('editPrice').value;
      const category = document.getElementById('editCategory').value;
      const note = document.getElementById('editNote').value.trim();

      if (!name || price === '' || isNaN(price)) { showToast("⚠️ بيانات غير صالحة"); return; }

      products[i].name = name;
      products[i].price = parseInt(price);
      products[i].category = category;
      products[i].note = note;
      saveAllData();
      closeModal();
    }

    function deleteProduct(i) {
      if (confirm(`حذف "${products[i].name}"؟`)) {
        products.splice(i, 1);
        saveAllData();
      }
    }

    function closeModal() {
      document.getElementById('modalContainer').innerHTML = '';
    }

    // ==================== الثيم ====================
    function loadThemeToForm() {
      document.getElementById('themePrimary').value = theme.primary || '#007AFF';
      document.getElementById('themeBg').value = theme.bg || '#F2F2F7';
      document.getElementById('themeText').value = theme.text || '#1C1C1E';
      document.getElementById('themeTextSecondary').value = theme.textSecondary || '#8E8E93';
      document.getElementById('themeCardBg').value = theme.cardBg || '#FFFFFF';
      updateColorPresetSelection();
    }

    function selectPreset(color) {
      document.getElementById('themePrimary').value = color;
      updateColorPresetSelection();
    }

    function updateColorPresetSelection() {
      const current = document.getElementById('themePrimary').value;
      document.querySelectorAll('.color-preset').forEach(el => {
        el.classList.toggle('active', el.dataset.color === current);
      });
    }

    function saveTheme() {
      theme = {
        primary: document.getElementById('themePrimary').value,
        bg: document.getElementById('themeBg').value,
        text: document.getElementById('themeText').value,
        textSecondary: document.getElementById('themeTextSecondary').value,
        cardBg: document.getElementById('themeCardBg').value,
        navBg: document.getElementById('themeBg').value,
        headerBg: document.getElementById('themeCardBg').value,
      };
      saveAllData();
    }

    function resetTheme() {
      theme = {
        primary: '#007AFF', bg: '#F2F2F7', text: '#1C1C1E',
        textSecondary: '#8E8E93', cardBg: '#FFFFFF',
        navBg: '#F2F2F7', headerBg: '#FFFFFF',
      };
      saveAllData(() => {
        loadThemeToForm();
      });
    }

    // ==================== التبويبات ====================
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).style.display = 'block';
      event.target.classList.add('active');
    }

    // ==================== تشغيل ====================
    loadData();
  </script>
</body>
</html>
